<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="50%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="5%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="10%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad)" rx="8" />

  <!-- Spine bookmark / shadow -->
  <rect width="36" height="600" fill="url(#spineShadow)" />
  <line x1="36" y1="0" x2="36" y2="600" stroke="#4a5568" stroke-width="1" stroke-opacity="0.4" />

  <!-- Outer frame border -->
  <rect x="25" y="25" width="350" height="550" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8 4" rx="4" opacity="0.6" />
  <rect x="35" y="35" width="330" height="530" fill="none" stroke="#4a5568" stroke-width="1" rx="2" opacity="0.4" />

  <!-- Center emblem & book icon -->
  <g transform="translate(200, 230)">
    <circle r="52" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Book Icon -->
    <path d="M-22 -15 C-12 -22 0 -17 0 -10 L0 18 C0 11 -12 6 -22 13 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M22 -15 C12 -22 0 -17 0 -10 L0 18 C0 11 12 6 22 13 Z" fill="url(#goldGrad)" opacity="0.9" />
    <line x1="0" y1="-10" x2="0" y2="18" stroke="#1e293b" stroke-width="2" />
  </g>

  <!-- Title & Label -->
  <text x="200" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f7fafc" text-anchor="middle" letter-spacing="1.5">BOOKNEST</text>
  <text x="200" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#a0aec0" text-anchor="middle" letter-spacing="0.5">Cover Unavailable</text>

  <g transform="translate(200, 420)">
    <line x1="-40" y1="0" x2="40" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7" />
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#fda085" />
  </g>

  <text x="200" y="520" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#718096" text-anchor="middle">Standard Catalogue Edition</text>
</svg>
