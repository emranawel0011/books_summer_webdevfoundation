<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f4037" />
      <stop offset="100%" stop-color="#99f2c8" />
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="5%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="12%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bgGrad)" rx="8"/>
  <rect width="36" height="600" fill="url(#spine)" />
  <line x1="36" y1="0" x2="36" y2="600" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" />

  <rect x="24" y="24" width="352" height="552" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" rx="4"/>
  
  <text x="200" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">SELF-HELP</text>
  
  <g transform="translate(200, 240)">
    <circle r="44" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="1.5" />
    <text y="9" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">&#128218;</text>
  </g>

  <text x="200" y="350" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Deep Work
  </text>
  <text x="200" y="410" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="500" fill="#e2e8f0" text-anchor="middle">
    by Cal Newport
  </text>

  <g transform="translate(200, 470)">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
  </g>
</svg>